name: Refresh portfolio with Copilot

on:
  workflow_dispatch:
    inputs:
      instructions:
        description: Extra design or content instructions for this refresh
        required: false
        type: string
      model:
        description: Optional Copilot model ID (leave blank for automatic selection)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: copilot-portfolio-refresh
  cancel-in-progress: false

jobs:
  start-copilot-task:
    name: Ask Copilot to refresh the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT }}
      OWNER: alanthssss
      TARGET_REPOSITORY: ${{ github.repository }}
      BASE_REF: ${{ github.event.repository.default_branch }}
      EXTRA_INSTRUCTIONS: ${{ inputs.instructions }}
      COPILOT_MODEL: ${{ inputs.model }}
    steps:
      - name: Verify required secret
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Add a repository secret named COPILOT_PAT before running this workflow."
            exit 1
          fi

      - name: Read pinned projects
        id: pinned
        shell: bash
        run: |
          gh api graphql \
            -f login="$OWNER" \
            -f query='query($login: String!) {
              user(login: $login) {
                pinnedItems(first: 6, types: [REPOSITORY]) {
                  nodes {
                    ... on Repository {
                      name
                      description
                      url
                      homepageUrl
                      stargazerCount
                      forkCount
                      primaryLanguage { name color }
                      repositoryTopics(first: 10) { nodes { topic { name } } }
                    }
                  }
                }
              }
            }' > pinned.json

          count="$(jq '.data.user.pinnedItems.nodes | length' pinned.json)"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No pinned repositories were returned for $OWNER."
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Build the Copilot task
        shell: bash
        run: |
          jq '.data.user.pinnedItems.nodes' pinned.json > pinned-projects.json
          {
            cat <<'PROMPT'
          Design and update the GitHub Pages portfolio in this repository for https://alanthssss.github.io/.

          The portfolio must feature the owner's currently pinned GitHub projects. Treat the JSON below as the authoritative snapshot for this run:

          ```json
          PROMPT
            cat pinned-projects.json
            cat <<'PROMPT'
          ```

          Requirements:
          - Inspect the existing repository and preserve anything that is already useful.
          - Create a polished, distinctive, responsive static portfolio suitable for GitHub Pages.
          - Make the pinned projects the primary content. Use only facts present in the JSON or repository content; do not invent metrics, roles, employers, testimonials, or project claims.
          - Every project card must link to its repository. Use homepage links only when provided.
          - Provide excellent typography, spacing, keyboard navigation, focus states, semantic HTML, reduced-motion support, and strong mobile behavior.
          - Avoid external runtime dependencies and secrets. The deployed page must work as static files from the repository root.
          - Do not add analytics, tracking, contact forms, or fabricated personal details.
          - Update README.md when setup or architecture changes.
          - Validate the result using the repository's available checks. Keep the pull request focused on the portfolio.
          PROMPT
            if [[ -n "$EXTRA_INSTRUCTIONS" ]]; then
              printf '\nAdditional instructions from the workflow operator:\n%s\n' "$EXTRA_INSTRUCTIONS"
            fi
          } > copilot-prompt.md

      - name: Start Copilot coding agent
        id: copilot
        shell: bash
        run: |
          jq -n \
            --rawfile prompt copilot-prompt.md \
            --arg base_ref "$BASE_REF" \
            --arg model "$COPILOT_MODEL" \
            '{
              prompt: $prompt,
              base_ref: $base_ref,
              create_pull_request: true
            } + (if $model == "" then {} else {model: $model} end)' > request.json

          response="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/agents/repos/$TARGET_REPOSITORY/tasks" \
            --input request.json)"

          task_id="$(jq -r '.id // .task_id // empty' <<< "$response")"
          task_url="$(jq -r '.html_url // .url // empty' <<< "$response")"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "task_url=$task_url" >> "$GITHUB_OUTPUT"

          {
            echo "## Copilot portfolio refresh started"
            echo
            echo "Pinned projects supplied: ${{ steps.pinned.outputs.count }}"
            echo "Base branch: \`$BASE_REF\`"
            [[ -n "$task_id" ]] && echo "Task ID: \`$task_id\`"
            [[ -n "$task_url" ]] && echo "Task: $task_url"
            echo
            echo "Copilot will open a pull request for review when the task is ready."
          } >> "$GITHUB_STEP_SUMMARY"


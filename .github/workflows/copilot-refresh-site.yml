name: Refresh portfolio with Copilot

on:
  workflow_dispatch:
    inputs:
      instructions:
        description: Extra design or content instructions for this refresh
        required: false
        type: string
      model:
        description: Optional Copilot model ID (leave blank for automatic selection)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: copilot-portfolio-refresh
  cancel-in-progress: false

jobs:
  start-copilot-task:
    name: Ask Copilot to refresh the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT }}
      OWNER: alanthssss
      TARGET_REPOSITORY: ${{ github.repository }}
      BASE_REF: ${{ github.event.repository.default_branch }}
      EXTRA_INSTRUCTIONS: ${{ inputs.instructions }}
      COPILOT_MODEL: ${{ inputs.model }}
    steps:
      - name: Verify required secret
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Add a repository secret named COPILOT_PAT before running this workflow."
            exit 1
          fi

      - name: Read pinned projects
        id: pinned
        shell: bash
        run: |
          gh api graphql \
            -f login="$OWNER" \
            -f query='query($login: String!) {
              user(login: $login) {
                pinnedItems(first: 6, types: [REPOSITORY]) {
                  nodes {
                    ... on Repository {
                      name
                      nameWithOwner
                      description
                      url
                      homepageUrl
                      createdAt
                      updatedAt
                      isArchived
                      stargazerCount
                      forkCount
                      licenseInfo { name }
                      primaryLanguage { name color }
                      languages(first: 8, orderBy: {field: SIZE, direction: DESC}) {
                        nodes { name color }
                      }
                      repositoryTopics(first: 10) { nodes { topic { name } } }
                    }
                  }
                }
              }
            }' > pinned.json

          count="$(jq '.data.user.pinnedItems.nodes | length' pinned.json)"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No pinned repositories were returned for $OWNER."
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Build the Copilot task
        shell: bash
        run: |
          jq '.data.user.pinnedItems.nodes' pinned.json > pinned-projects.json

          : > pinned-readmes.md
          while IFS= read -r repository; do
            {
              printf '\n## %s README\n\n' "$repository"
              if readme="$(gh api \
                -H 'Accept: application/vnd.github.raw+json' \
                "/repos/$OWNER/$repository/readme" 2>/dev/null)"; then
                # Enough source material for an accurate profile without making
                # the agent request unnecessarily large.
                printf '%s\n' "${readme:0:12000}"
              else
                echo '_No README was available through the GitHub API._'
              fi
            } >> pinned-readmes.md
          done < <(jq -r '.[].name' pinned-projects.json)

          {
            cat <<'PROMPT'
          Design and update the GitHub Pages portfolio in this repository for https://alanthssss.github.io/.

          The portfolio must feature the owner's currently pinned GitHub projects. Treat the JSON and README excerpts below as the authoritative source material for this run.

          ### Repository metadata

          ```json
          PROMPT
            cat pinned-projects.json
            cat <<'PROMPT'
          ```

          ### Repository README excerpts

          PROMPT
            cat pinned-readmes.md
            cat <<'PROMPT'

          Requirements:
          - Inspect the existing repository and preserve anything that is already useful.
          - Create a polished, distinctive, responsive static portfolio suitable for GitHub Pages.
          - Make the pinned projects the primary content. Present each one as a concise resume-style project experience, not as a raw GitHub snapshot or generic repository card.
          - For every pinned project, create a clear project title and professional summary, then organize verified details into resume-like fields such as role/scope, problem or objective, key engineering work, technology stack, and measurable outcomes or evidence. Adapt or omit fields when the source material does not support them.
          - Write outcome-oriented bullets with strong verbs, but use only facts present in the supplied JSON, README excerpts, or this repository. Never infer the owner's role, dates, team size, employers, users, performance gains, or metrics. If evidence is unavailable, omit the claim instead of adding placeholders or speculation.
          - Make all portfolio navigation, headings, summaries, project profiles, labels, calls to action, accessibility text, and other visitor-facing copy available in both Simplified Chinese and English. Provide an obvious, keyboard-accessible language switcher; set the document language correctly when switching and remember the visitor's choice locally. The complete core experience must remain usable without JavaScript.
          - Keep the Chinese and English versions equivalent in meaning and information hierarchy. Do not present machine-like literal translations or mix languages inside a sentence unless it is a proper noun or technical term.
          - Every project card must link to its repository. Use homepage links only when provided.
          - Provide excellent typography, spacing, keyboard navigation, focus states, semantic HTML, reduced-motion support, and strong mobile behavior.
          - Avoid external runtime dependencies and secrets. The deployed page must work as static files from the repository root.
          - Do not add analytics, tracking, contact forms, or fabricated personal details.
          - Keep portfolio-related documentation and workflow instructions in README.md available in both Simplified Chinese and English when setup or architecture changes.
          - Validate the result using the repository's available checks. Keep the pull request focused on the portfolio.
          PROMPT
            if [[ -n "$EXTRA_INSTRUCTIONS" ]]; then
              printf '\nAdditional instructions from the workflow operator:\n%s\n' "$EXTRA_INSTRUCTIONS"
            fi
          } > copilot-prompt.md

      - name: Start Copilot coding agent
        id: copilot
        shell: bash
        run: |
          jq -n \
            --rawfile prompt copilot-prompt.md \
            --arg base_ref "$BASE_REF" \
            --arg model "$COPILOT_MODEL" \
            '{
              prompt: $prompt,
              base_ref: $base_ref,
              create_pull_request: true
            } + (if $model == "" then {} else {model: $model} end)' > request.json

          response="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/agents/repos/$TARGET_REPOSITORY/tasks" \
            --input request.json)"

          task_id="$(jq -r '.id // .task_id // empty' <<< "$response")"
          task_url="$(jq -r '.html_url // .url // empty' <<< "$response")"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "task_url=$task_url" >> "$GITHUB_OUTPUT"

          {
            echo "## Copilot portfolio refresh started"
            echo
            echo "Pinned projects supplied: ${{ steps.pinned.outputs.count }}"
            echo "Base branch: \`$BASE_REF\`"
            [[ -n "$task_id" ]] && echo "Task ID: \`$task_id\`"
            [[ -n "$task_url" ]] && echo "Task: $task_url"
            echo
            echo "Copilot will open a pull request for review when the task is ready."
          } >> "$GITHUB_STEP_SUMMARY"
